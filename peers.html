  mk('c_q',{type:'line',data:{labels:g.quarters.labels,datasets:g.quarters.series.map(function(s,i){return {label:s.name,borderColor:PAL[i%PAL.length],backgroundColor:PAL[i%PAL.length],tension:.2,spanGaps:true,data:s.values.map(function(v){return v==null?null:Math.round(v/1e8);})};})},options:{plugins:{title:{display:true,text:'분기 영업이익 추이 (억원)'}},maintainAspectRatio:false}});
  g.segments.forEach(function(sg,i){if(!sg.rows.length)return;mk('pie'+i,{type:'pie',data:{labels:sg.rows.map(function(r){return r.label;}),datasets:[{data:sg.rows.map(function(r){return r.pct==null?0:Math.round(r.pct*1000)/10;}),backgroundColor:PAL}]},options:{plugins:{legend:{position:'bottom',labels:{boxWidth:10,font:{size:10}}},tooltip:{callbacks:{label:function(c){return c.label+': '+c.parsed+'%';}}}},maintainAspectRatio:false}});});
  mk('c_share',{type:'bar',data:{labels:g.market_share.map(function(m){return m.label;}),datasets:n.map(function(nm,i){return {label:nm,backgroundColor:PAL[i%PAL.length],data:g.market_share.map(function(m){var c=m.cells[i];return c.share==null?null:Math.round(c.share*1000)/10;})};})},options:{indexAxis:'y',scales:{x:{stacked:true,max:100},y:{stacked:true}},plugins:{title:{display:true,text:'비교 대상 내 점유율 (%)'}},maintainAspectRatio:false}});
}
document.getElementById('meta').textContent='생성: '+D.generated+' · 비교 그룹 '+D.groups.length+'개';
var tabs=document.getElementById('tabs');
D.groups.forEach(function(g,i){var b=document.createElement('button');b.textContent=g.group+' ('+g.names.length+')';b.onclick=function(){show(i);};tabs.appendChild(b);});
if(D.groups.length)show(0);else document.getElementById('root').innerHTML='<div class="card">config/peers.csv 에 비교 대상이 없습니다.</div>';
})();
</script></body></html>
