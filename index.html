  }
  if(c.news && c.news.length){
    h += '<h3>연도별 변동 근거 (네이버 뉴스)</h3><div class="sub">DART 숫자에서 변화가 큰 항목과, 그 해 관련 기사입니다. 기사는 원인을 증명하지 않는 참고 자료이며 제목·링크만 보여 줍니다. [ ] 안은 기사에 나온 숫자입니다.</div>';
    c.news.forEach(function(n){
      h += '<div style="margin:8px 0"><b>'+esc(n.year)+'년</b> 주요 변동: '+(n.movers.length?n.movers.map(function(m){return esc(m.label)+' '+yoyCell(m.yoy)+' ('+eok(m.prev)+'→'+eok(m.cur)+'억원)';}).join(' · '):'<span class="na">-</span>');
      if(n.articles.length){
        h += '<ul>'+n.articles.map(function(a){return '<li>'+esc(a.date)+' · '+esc(a.source)+' · <a href="'+esc(a.link)+'" target="_blank" rel="noopener noreferrer">'+esc(a.title)+'</a>'+(a.nums.length?' <span class="na">['+esc(a.nums.join(', '))+']</span>':'')+'</li>';}).join('')+'</ul>';
      } else { h += '<div class="sub">수집된 기사가 아직 없습니다.</div>'; }
      h += '</div>';
    });
  }
  h += '<h3>주요 이벤트 공시</h3>';
  if(c.events.length){
    h += '<ul>'+c.events.map(function(e){return '<li>'+esc(e.date)+' · <b>'+esc(e.type)+'</b> · '+esc(e.title)+'</li>';}).join('')+'</ul>';
  } else { h += '<div class="sub">해당 공시 없음</div>'; }
  h += '</div>';
  root.insertAdjacentHTML('beforeend', h);
});
if(window.Chart){
  D.companies.forEach(function(c, idx){
    var el = document.getElementById('ch'+idx);
    if(!el||!c.quarters.length) return;
    var rk = c.financial ? 'op_revenue' : 'revenue';
    new Chart(el, {type:'bar', data:{labels:c.quarters.map(function(q){return q.label;}),
      datasets:[{label:c.financial?'영업수익':'매출액', data:c.quarters.map(function(q){return q[rk]==null?null:q[rk]/1e8;}), backgroundColor:'#9db7e8'},
                {label:'영업이익', data:c.quarters.map(function(q){return q.operating_income==null?null:q.operating_income/1e8;}), backgroundColor:'#274690'}]},
      options:{responsive:true, plugins:{legend:{position:'bottom'}}}});
  });
}
})();
</script></body></html>
