<script src="vendor/chart.umd.min.js"></script>
<script>
(function(){
var D = JSON.parse(document.getElementById('data').textContent);
var LABELS = {revenue:'매출액', operating_income:'영업이익', operating_cost:'영업비용', net_income:'당기순이익'};
var LABELS_FIN = {op_revenue:'영업수익', op_cost:'영업비용', operating_income:'영업이익', nonop_income:'영업외수익', nonop_expense:'영업외비용', net_income:'당기순이익'};
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function eok(v){return v==null?'<span class="na">-</span>':Math.round(v/1e8).toLocaleString('ko-KR');}
function pct(v){return v==null?'<span class="na">-</span>':(v*100).toFixed(1)+'%';}
function yoyCell(v){if(v==null)return '<span class="na">-</span>';var c=v>=0?'up':'down';return '<span class="'+c+'">'+(v>=0?'+':'')+(v*100).toFixed(1)+'%</span>';}
function ratio(v){return v==null?'<span class="na">-</span>':v.toFixed(1)+'%';}
document.getElementById('meta').textContent = '생성: ' + D.generated + ' · 대상 ' + D.companies.length + '곳';
var root = document.getElementById('root');
if(!D.companies.length){root.innerHTML='<div class="card empty">표시할 기업이 없습니다. config/targets.csv 를 확인하세요.</div>';}
D.companies.forEach(function(c, idx){
  var LB = c.financial ? LABELS_FIN : LABELS;
  var h = '<div class="card"><h2>'+esc(c.name)+(c.financial?'<span class="badge">금융업</span>':'')+'</h2>';
  h += '<div class="sub">'+esc(c.code||'비상장·코드 없음')+'</div>';
  if(c.quarters.length){
    h += '<h3>분기 손익 (억원)</h3><div class="wrap"><table><tr><th>분기</th>';
    c.quarters.forEach(function(q){h+='<th>'+esc(q.label)+'</th>';});
    h += '</tr>';
    Object.keys(LB).forEach(function(m){
      h += '<tr><td>'+LB[m]+'</td>';
      c.quarters.forEach(function(q){h+='<td>'+eok(q[m])+'</td>';});
      h += '</tr><tr><td class="na">　YoY</td>';
      c.quarters.forEach(function(q){h+='<td>'+yoyCell(q[m+'_yoy'])+'</td>';});
      h += '</tr>';
    });
    h += '</table></div><canvas id="ch'+idx+'"></canvas>';
    if(c.annual && c.annual.rows.length){
      var AL = c.annual.financial ? LABELS_FIN : LABELS;
      h += '<h3>연도별 손익 (억원, 4개 분기 합계)</h3><div class="wrap"><table><tr><th>연도</th>';
      c.annual.rows.forEach(function(q){h+='<th>'+esc(q.label)+'</th>';});
      h += '</tr>';
      c.annual.metrics.forEach(function(m){
        h += '<tr><td>'+AL[m]+'</td>';
        c.annual.rows.forEach(function(q){h+='<td>'+eok(q[m])+'</td>';});
        h += '</tr><tr><td class="na">　YoY</td>';
        c.annual.rows.forEach(function(q){h+='<td>'+yoyCell(q[m+'_yoy'])+'</td>';});
        h += '</tr>';
      });
      h += '</table></div>';
    }
  } else if(!c.fisis.length){
    h += '<div class="sub">아직 수집된 재무 데이터가 없습니다.</div>';
  }
  if(c.financial){
    h += '<h3>재무건전성 비율</h3><div class="sub">금융업은 일반 기업 비율이 해당 없음입니다.</div>';
  } else if(c.ratios){
    var r=c.ratios;
    h += '<h3>재무건전성 ('+esc(r.period)+', 누적 기준)</h3><div class="wrap"><table><tr><th>유동비율</th><th>당좌비율</th><th>부채비율</th><th>차입금</th><th>순차입금</th><th>EBITDA</th><th>FCF</th></tr><tr><td>'+
      ratio(r.current_ratio)+'</td><td>'+ratio(r.quick_ratio)+'</td><td>'+ratio(r.debt_ratio)+'</td><td>'+eok(r.debt)+'</td><td>'+eok(r.net_debt)+'</td><td>'+eok(r.ebitda)+(r.ebitda_basis?'<br><span class="na">'+esc(r.ebitda_basis)+'</span>':'')+'</td><td>'+eok(r.fcf)+'</td></tr></table></div>';
  }
  if(c.fisis.length){
    var periods = [];
    c.fisis.forEach(function(f){if(periods.indexOf(f.period)<0)periods.push(f.period);});
    periods.sort(); periods = periods.slice(-8);
    var inds = [];
    c.fisis.forEach(function(f){if(inds.indexOf(f.indicator)<0)inds.push(f.indicator);});
    h += '<h3>금융업 지표 (FISIS)</h3><div class="wrap"><table><tr><th>지표</th>';
    periods.forEach(function(p){h+='<th>'+esc(p)+'</th>';});
    h += '</tr>';
    inds.forEach(function(i){
      h += '<tr><td>'+esc(i)+'</td>';
      periods.forEach(function(p){
        var f = c.fisis.filter(function(x){return x.indicator===i&&x.period===p;})[0];
        h += '<td>'+(f?esc(f.value):'<span class="na">-</span>')+'</td>';
      });
      h += '</tr>';
    });
    h += '</table></div>';
  }
  if(c.sec){
    var sg=c.sec.segments;
    if(sg){
      h += '<h3>사업부문별 실적 (연결, '+esc(sg.cur)+' vs '+esc(sg.prev)+', 억원)</h3><div class="wrap"><table><tr><th>구분</th>';
      sg.cols.forEach(function(n){h+='<th>'+esc(n)+'</th>';});
      h += '</tr>';
      sg.rows.forEach(function(r){
        h += '<tr><td>'+(r.bold?'<b>'+esc(r.label)+'</b>':esc(r.label))+'</td>';
        sg.cols.forEach(function(n,i){
          h += '<td>'+(r.vals?eok(r.vals[i]):r.yoy?yoyCell(r.yoy[i]):pct(r.pct[i]))+'</td>';
        });
        h += '</tr>';
      });
      h += '</table></div><div class="sub">DART 사업(반기)보고서 ‘사업의 내용’ 부문별 영업실적 표. 순영업손익은 수수료·이자·금융상품·기타손익의 합입니다.</div>';
    }
    var fe=c.sec.fees;
    if(fe){
      h += '<h3>수수료·운용손익 (별도, 억원)</h3><div class="wrap"><table><tr><th>항목</th>';
      fe.periods.forEach(function(p){h+='<th>'+esc(p)+'</th>';});
      h += '<th>'+esc(fe.yoy_label||'최근 YoY')+'</th></tr>';
      fe.rows.forEach(function(r){
        h += '<tr><td>'+esc(r.label)+'</td>';
        fe.periods.forEach(function(p){h+='<td>'+eok(r.vals[p])+'</td>';});
        h += '<td>'+yoyCell(r.yoy)+'</td></tr>';
      });
      h += '</table></div>';
    }
  }
  if(c.news && c.news.length){
    h += '<h3>연도별 변동 근거 (네이버 뉴스)</h3><div class="sub">DART 숫자에서 변화가 큰 항목과, 그 해 관련 기사입니다. 기사는 원인을 증명하지 않는 참고 자료이며 제목·링크만 보여 줍니다. [ ] 안은 기사에 나온 숫자입니다.</div>';
    c.news.forEach(function(n){
      h += '<div style="margin:8px 0"><b>'+esc(n.year)+'년</b> 주요 변동: '+(n.movers.length?n.movers.map(function(m){return esc(m.label)+' '+yoyCell(m.yoy)+' ('+eok(m.prev)+'→'+eok(m.cur)+'억원)';}).join(' · '):'<span class="na">-</span>');
      if(n.articles.length){
        h += '<ul>'+n.articles.map(function(a){return '<li>'+esc(a.date)+' · '+esc(a.source)+' · <a href="'+esc(a.link)+'" target="_blank" rel="noopener noreferrer">'+esc(a.title)+'</a>'+(a.nums.length?' <span class="na">['+esc(a.nums.join(', '))+']</span>':'')+'</li>';}).join('')+'</ul>';
      } else { h += '<div class="sub">수집된 기사가 아직 없습니다.</div>'; }
      h += '</div>';
    });
  }
  h += '<h3>주요 이벤트 공시</h3>';
  if(c.events.length){
    h += '<ul>'+c.events.map(function(e){return '<li>'+esc(e.date)+' · <b>'+esc(e.type)+'</b> · '+esc(e.title)+'</li>';}).join('')+'</ul>';
  } else { h += '<div class="sub">해당 공시 없음</div>'; }
  h += '</div>';
  root.insertAdjacentHTML('beforeend', h);
});
if(window.Chart){
  D.companies.forEach(function(c, idx){
    var el = document.getElementById('ch'+idx);
    if(!el||!c.quarters.length) return;
    var rk = c.financial ? 'op_revenue' : 'revenue';
    new Chart(el, {type:'bar', data:{labels:c.quarters.map(function(q){return q.label;}),
      datasets:[{label:c.financial?'영업수익':'매출액', data:c.quarters.map(function(q){return q[rk]==null?null:q[rk]/1e8;}), backgroundColor:'#9db7e8'},
                {label:'영업이익', data:c.quarters.map(function(q){return q.operating_income==null?null:q.operating_income/1e8;}), backgroundColor:'#274690'}]},
      options:{responsive:true, plugins:{legend:{position:'bottom'}}}});
  });
}
})();
</script></body></html>
